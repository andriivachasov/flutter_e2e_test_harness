name: e2e_orchestrator
description: >-
  E2E harness orchestrator CLI: boots devices and backend, runs Patrol tests
  across devices with synchronization, collects artifacts.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  shelf: ^1.4.1
  yaml: ^3.1.2

dev_dependencies:
  test: ^1.25.0
  # Test-only: lets the sync-server tests drive the real SyncClient, so the
  # two halves of the wire contract are verified against each other rather
  # than against a mock. test_support itself stays dependency-free.
  e2e_test_support:
    path: ../test_support

executables:
  e2e: e2e
